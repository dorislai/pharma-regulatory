[project]
name = "pharma-reg-mcp"
version = "0.1.0"
description = "法規查詢 MCP：用固定程式抓取官方公開法規（美國 eCFR Title 21、台灣全國法規資料庫），每筆回傳都帶出處與版本紀錄的最小原型"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "mcp>=1.9,<2",   # 官方 MCP SDK（內含 FastMCP）
    "httpx>=0.27",   # 用來呼叫官方 API 的 HTTP 套件
]

[project.urls]
Repository = "https://github.com/dorislai/pharma-regulatory"

[project.scripts]
# 安裝後會多一個指令 `pharma-reg-mcp`，執行它就是啟動 MCP server
pharma-reg-mcp = "pharma_reg_mcp.server:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pharma_reg_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
